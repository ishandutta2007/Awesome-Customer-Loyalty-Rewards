<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      
      /* Subtle Keyframe Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.65; transform: scale(1.08) translate(-15px, 10px); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes spinCoin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }

      .floating-bg-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 900px 100px;
      }
      .floating-bg-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 200px 280px;
      }
      .anim-card-1 {
        animation: floatCard1 6s ease-in-out infinite;
      }
      .anim-card-2 {
        animation: floatCard2 7s ease-in-out infinite;
      }
      .path-flow {
        stroke-dasharray: 8, 8;
        animation: dashAnim 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Circuit / Tech Grid Pattern in Background -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Ambient Light Orbs (Background only, under text) -->
  <circle class="floating-bg-orb-1" cx="950" cy="110" r="160" fill="#ec4899" filter="url(#glow)" opacity="0.35" />
  <circle class="floating-bg-orb-2" cx="220" cy="270" r="140" fill="#3b82f6" filter="url(#glow)" opacity="0.3" />
  <circle class="floating-bg-orb-1" cx="800" cy="280" r="120" fill="#f59e0b" filter="url(#glow)" opacity="0.25" />

  <!-- Animated connecting flow lines on the right side -->
  <g opacity="0.4">
    <path class="path-flow" d="M 760 110 C 840 70, 920 180, 1020 130" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <path class="path-flow" d="M 780 230 C 860 260, 950 180, 1060 220" fill="none" stroke="#a855f7" stroke-width="2.5" />
  </g>

  <!-- Floating Graphic Cards on the Right (Framing without obstructing title) -->
  <g class="anim-card-1" transform="translate(860, 60)">
    <!-- Reward Pill Card -->
    <rect width="260" height="84" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" backdrop-filter="blur(10px)" />
    <!-- Icon Container -->
    <rect x="16" y="18" width="48" height="48" rx="10" fill="#f59e0b" fill-opacity="0.15" />
    <!-- Coin Icon -->
    <circle cx="40" cy="42" r="14" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <text x="35" y="47" font-family="-apple-system, sans-serif" font-weight="800" font-size="15" fill="#f59e0b">$</text>
    <text x="76" y="42" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Cashback &amp; Points</text>
    <text x="76" y="60" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#10b981">+5.0% Auto-Earn</text>
  </g>

  <g class="anim-card-2" transform="translate(820, 185)">
    <!-- Loyalty VIP Card -->
    <rect width="280" height="92" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
    <rect x="18" y="20" width="52" height="52" rx="10" fill="#8b5cf6" fill-opacity="0.2" />
    <!-- Gift / Tier Crown Icon -->
    <path d="M 32 54 L 32 38 L 38 46 L 44 34 L 50 46 L 56 38 L 56 54 Z" fill="#a78bfa" />
    <text x="82" y="44" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">VIP Tier &amp; Referrals</text>
    <text x="82" y="64" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Tier 3 Platinum Member</text>
  </g>

  <!-- Left Content Area: Hero Header, Subtitle, and Feature Badges (Always in foreground) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, 58)">
      <rect width="230" height="28" rx="14" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#f59e0b" />
      <text x="30" y="19" class="badge-text" fill="#f59e0b">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">Customer Loyalty &amp; Rewards</text>

    <!-- Subtitle -->
    <text x="0" y="172" class="subtitle">Cashback Networks • Points Engines • Tiered Coalition &amp; Referral Systems</text>

    <!-- Feature Pills Bar -->
    <g transform="translate(0, 222)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="4" fill="#10b981" />
        <text x="34" y="24" class="pill-text">SaaS Leaders</text>
      </g>

      <!-- Pill 2: Open-Source Engines -->
      <g transform="translate(196, 0)">
        <rect width="200" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="4" fill="#38bdf8" />
        <text x="34" y="24" class="pill-text">Open-Source Engines</text>
      </g>

      <!-- Pill 3: Star Ranked -->
      <g transform="translate(412, 0)">
        <rect width="160" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="4" fill="#fbbf24" />
        <text x="34" y="24" class="pill-text">★ Star-Ranked</text>
      </g>
    </g>

    <!-- Bottom Accent Ribbon / Underline -->
    <rect x="0" y="295" width="460" height="4" rx="2" fill="url(#accent-grad)" />
  </g>
</svg>